# Minimal Mistakes theme with dark mode
remote_theme: mmistakes/minimal-mistakes@4.26.2
minimal_mistakes_skin: "dark"

# Site
locale: "en-US"
title: "Rodrigo Bonifácio"
title_separator: "|"
name: "Rodrigo Bonifácio"
description: "Associate Professor in Software Engineering"
url: "https://rbonifacio.github.io"
baseurl: ""
repository: "rbonifacio/rbonifacio.github.io"

# Author (add avatar: "/assets/images/profile.jpg" when you have a profile photo)
author:
  name: "Rodrigo Bonifácio"
  bio: "Associate Professor at the [Informatics Center](https://portal.cin.ufpe.br/), Federal University of Pernambuco. Research in program analysis, software maintenance, and software security."
  location: "Recife, Brazil"
  links:
    - label: "Google Scholar"
      icon: "ai ai-google-scholar"
      url: "https://scholar.google.com/citations?user=YegiOugAAAAJ&hl=en"
    - label: "DBLP"
      icon: "ai ai-dblp"
      url: "https://dblp.org/pid/21/824"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/rbonifacio"
    - label: "GitLab"
      icon: "fab fa-fw fa-gitlab"
      url: "https://gitlab.com/rbonifacio"

# Reading
words_per_minute: 160
read_time: false

# Output
permalink: /:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-remote-theme

# Exclude (Gemfile is needed for GitHub Pages build)
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - deleteme.txt

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
